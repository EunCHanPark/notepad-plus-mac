name: Build macOS ZIP

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app (${{ matrix.arch }})
        run: npx electron-builder --mac dir --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Ad-hoc code sign
        run: |
          APP_PATH=$(find dist -name "*.app" -maxdepth 2 | head -1)
          echo "Signing: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          echo "Verifying signature..."
          codesign --verify --deep "$APP_PATH" && echo "Signature valid" || echo "Signature check failed"

      - name: Create ZIP
        run: |
          APP_PATH=$(find dist -name "*.app" -maxdepth 2 -print -quit)
          APP_DIR=$(dirname "$APP_PATH")
          ZIP_NAME="Notepad+Mac-${{ matrix.arch }}.zip"
          cd "$APP_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$(basename "$APP_PATH")" "../$ZIP_NAME"
          ls -lh "../$ZIP_NAME"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepad-plus-mac-${{ matrix.arch }}
          path: dist/*.zip

  release:
    needs: build-mac
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          draft: false
          prerelease: false
